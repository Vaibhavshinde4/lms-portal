<aside class="sidebar" [class.open]="isOpen">
  <!-- Hamburger -->

  <div class="sb-brand">
    <img class="sb-logo" src="assets/images/att-logo.jpg" />

    <div class="fiber">
      <h1>Fiber Academy</h1>
      <div class="sub">AT&T FUTURE FIBER</div>
    </div>
  </div>

  <div class="sb-menu-label">MENU</div>

  <nav class="sb-nav">
    <button
      *ngFor="let item of menuItems"
      class="sb-link"
      [class.active]="activeRoute === item.route"
      (click)="setActive(item.route)"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        [innerHTML]="item.icon"
      ></svg>

      <span>{{ item.label }}</span>
    </button>
  </nav>

  <div class="sb-foot">
    <div class="ava">DJ</div>

    <div class="who">
      Dane Johnson
      <small>Trainee</small>
    </div>
  </div>
</aside>
